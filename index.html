<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111d">
<title>Samoth — Compagnon de combat</title>
<style>html,body{margin:0;min-height:100%;background:#04080e;color:#f4f8fb;font-family:system-ui,-apple-system,sans-serif}main{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.ice{color:#a8e7ff}a{color:#a8e7ff}</style>
</head>
<body>
<main id="loading"><div><h1 class="ice">SAMOTH</h1><p>Chargement du compagnon de combat…</p></div></main>
<script>
fetch('https://raw.githubusercontent.com/bryantoualy-del/Kentaro/main/samoth/index.html?ts='+Date.now(),{cache:'no-store'})
.then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()})
.then(html=>{document.open();document.write(html);document.close()})
.catch(()=>{document.getElementById('loading').innerHTML='<div><h1 class="ice">SAMOTH</h1><p>Le compagnon n\'a pas pu être chargé.</p><p><a href="https://bryantoualy-del.github.io/Kentaro/samoth/">Ouvrir la version de secours</a></p></div>'});
</script>
</body>
</html>
