<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Companion V3 — contrôle responsive</title>
<style>body{margin:0;background:#0d1520;color:#e9f5ff;font:16px system-ui;padding:16px}button{background:#29465d;color:white;border:1px solid #81bedc;border-radius:10px;min-height:44px;padding:8px 15px;margin:3px}button.active{background:#276979}iframe{display:block;border:2px solid #8ebccf;border-radius:12px;height:820px;max-width:none;margin:12px auto;background:#090c12}#stage{overflow:auto}small{color:#abc1ca}</style>
<h1>Companion V3 · banc responsive</h1><p>Chaque iframe a exactement la largeur CSS choisie. Tester défilement horizontal, navigation, barre de tour, inventaire et notes.</p>
<div id="characters"><button data-character="Samoth">Samoth</button><button data-character="Brackmard">Brackmard</button><button data-character="Nans">Nans</button><button data-character="Rufus">Rufus</button></div>
<div id="widths"><button data-width="390">iPhone 390</button><button data-width="430">iPhone 430</button><button data-width="768">iPad 768</button><button data-width="1280">Desktop 1280</button></div><small id="selection"></small><div id="stage"><iframe id="test-frame" title="Compagnon testé" loading="eager"></iframe></div>
<script>let character='Samoth',width=390;function render(){document.querySelector('#test-frame').style.width=width+'px';document.querySelector('#test-frame').src='https://bryantoualy-del.github.io/'+character+'/?audit='+Date.now();document.querySelector('#selection').textContent=character+' · '+width+' px';document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.character===character||+b.dataset.width===width))}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.character)character=b.dataset.character;if(b.dataset.width)width=+b.dataset.width;render()});render()</script></html>
